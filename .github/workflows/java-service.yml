name: java-service

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      java_version:
        required: false
        type: string
        default: "21"
      publish:
        required: false
        type: boolean
        default: false
      run_evals:
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Validate commit messages
        if: github.event_name == 'pull_request'
        uses: wagoid/commitlint-github-action@v6

      - name: Format, lint, compile, test, and check coverage
        run: ./mvnw -B -ntp verify

      - name: Run AI eval gate
        if: inputs.run_evals
        run: ./mvnw -B -ntp -Pevals verify

      - name: Vulnerability scan (filesystem)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: "1"

  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container image via Jib
        run: ./mvnw -B -ntp jib:build -Dimage=ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}:${{ github.sha }}

      - name: Install cosign and syft
        uses: sigstore/cosign-installer@v3

      - name: Sign image keyless with cosign
        run: cosign sign --yes ghcr.io/${{ github.repository_owner }}/${{ inputs.service_name }}:${{ github.sha }}

      - name: Package and push OCI Helm chart
        run: |
          helm dependency update chart
          helm package chart --destination /tmp/charts
          helm push /tmp/charts/*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
